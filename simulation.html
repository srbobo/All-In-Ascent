<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Simulation Runner</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #00ff00;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff00;
            text-align: center;
        }
        .controls {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        button {
            background: #00ff00;
            color: #1e1e1e;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin: 5px;
        }
        button:hover {
            background: #00cc00;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #output {
            background: #000;
            padding: 20px;
            border-radius: 10px;
            height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 12px;
        }
        .progress {
            background: #2d2d2d;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            background: #00ff00;
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }
        .stats {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .stats.show {
            display: block;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .stat-box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #00ff00;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

            <button id="downloadBtn" onclick="downloadAllResults()" disabled>Download All Results</button>

            <div class="progress" id="progressContainer" style="display: none;">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>
        </div>

        <div id="output">Ready to run simulations. Click "Run 100 Simulations" to begin...</div>

        <div class="stats" id="statsPanel">

        // Simulation engine (trimmed version for browser)
        class GameSimulation {
            constructor(characterKey, simulationId) {
                this.simulationId = simulationId;
                this.round = 1;
                this.turnNumber = 0;
                this.maxRounds = 20;

                const charTemplate = CHARACTERS[characterKey];
                this.character = {
                    key: characterKey,
                    name: charTemplate.name,
                    level: 1,
                    xp: 0,
                    currentEndurance: charTemplate.startingEndurance,
                    maxEndurance: charTemplate.startingEndurance,
                    stats: { ...charTemplate.startingStats },
                    growth: { ...charTemplate.growth },
                    trainingBonuses: { strength: 0, technique: 0, focus: 0, flexibility: 0 },
                    timeRemaining: 10
                };

                // RuleModifications: Top Rope is open with 2 routes per belayer.
                // Solo sim = 1 belayer → 2 routes, available from round 1.
                this.belayerCount = 1;
                this.availableRoutes = {
                    bouldering: this.selectRandomRoutes(ROUTES.bouldering, 3),
                    topRope: this.selectRandomRoutes(ROUTES.topRope, this.belayerCount * 2),
                    leadClimbing: this.selectRandomRoutes(ROUTES.leadClimbing, 1)
                };

                this.routeClearingPosition = 0;
                this.log = [];
                this.stats = {
                    totalClimbs: 0,
                    successfulClimbs: 0,
                    failedClimbs: 0,
                    totalXP: 0,
                    finalLevel: 1,
                    routesAttempted: { bouldering: 0, topRope: 0, leadClimbing: 0 },
                    routesCompleted: { bouldering: 0, topRope: 0, leadClimbing: 0 },
                    trainingActions: 0,
                    restActions: 0,
                    highestGradeCompleted: { bouldering: '', topRope: '', leadClimbing: '' }
                };
            }

            selectRandomRoutes(pool, count) {
                const shuffled = [...pool].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, count);
            }

            logAction(action, details) {
                const totalStats = {
                    strength: this.character.stats.strength + this.character.trainingBonuses.strength,
                    technique: this.character.stats.technique + this.character.trainingBonuses.technique,
                    focus: this.character.stats.focus + this.character.trainingBonuses.focus,
                    flexibility: this.character.stats.flexibility + this.character.trainingBonuses.flexibility
                };

                this.log.push({
                    simulation: this.simulationId,
                    round: this.round,
                    turn: this.turnNumber,
                    action,
                    details,
                    state: {
                        level: this.character.level,
                        xp: this.character.xp,
                        endurance: `${this.character.currentEndurance}/${this.character.maxEndurance}`,
                        timeRemaining: this.character.timeRemaining,
                        stats: totalStats
                    }
                });
            }

            rollDice(count) {
                const rolls = [];
                for (let i = 0; i < count; i++) {
                    rolls.push(Math.floor(Math.random() * 6) + 1);
                }
                return rolls;
            }

            getTotalStats() {
                return {
                    strength: this.character.stats.strength + this.character.trainingBonuses.strength,
                    technique: this.character.stats.technique + this.character.trainingBonuses.technique,
                    focus: this.character.stats.focus + this.character.trainingBonuses.focus,
                    flexibility: this.character.stats.flexibility + this.character.trainingBonuses.flexibility
                };
            }

            canAttemptRoute(route) {
                return this.character.timeRemaining >= route.time &&
                       this.character.currentEndurance >= route.endurance;
            }

            attemptClimb(route, area) {
                this.stats.totalClimbs++;
                this.stats.routesAttempted[area]++;
                this.turnNumber++;

                const totalStats = this.getTotalStats();
                let numDice = 2;
                if (this.character.key === 'boulderer' && area === 'bouldering') {
                    numDice = 3;
                }

                const rolls = this.rollDice(numDice);
                const diceToUse = numDice === 3 ? rolls.sort((a, b) => b - a).slice(0, 2) : rolls;
                const diceTotal = diceToUse.reduce((a, b) => a + b, 0);

                const checks = {
                    strength: totalStats.strength - diceTotal >= route.strength,
                    technique: totalStats.technique - diceTotal >= route.technique,
                    focus: totalStats.focus - diceTotal >= route.focus,
                    flexibility: totalStats.flexibility - diceTotal >= route.flexibility
                };

                const success = checks.strength && checks.technique && checks.focus && checks.flexibility;

                this.character.timeRemaining -= route.time;
                this.character.currentEndurance -= route.endurance;

                const xpGained = success ? route.xpSuccess : route.xpFail;
                this.character.xp += xpGained;
                this.stats.totalXP += xpGained;

                if (success) {
                    this.stats.successfulClimbs++;
                    this.stats.routesCompleted[area]++;
                    const currentHighest = this.stats.highestGradeCompleted[area];
                    if (!currentHighest || this.compareGrade(route.grade, currentHighest, area) > 0) {
                        this.stats.highestGradeCompleted[area] = route.grade;
                    }
                } else {
                    this.stats.failedClimbs++;
                }

                this.checkLevelUp();
                this.logAction('CLIMB', { route: route.name, grade: route.grade, area, rolls, diceUsed, diceTotal, checks, success, xpGained, timeCost: route.time, enduranceCost: route.endurance });

                return success;
            }

            compareGrade(grade1, grade2, area) {
                if (area === 'bouldering') {
                    return parseInt(grade1.substring(1)) - parseInt(grade2.substring(1));
                }
                return parseFloat(grade1.substring(2)) - parseFloat(grade2.substring(2));
            }

            checkLevelUp() {
                if (this.character.level >= 15) return;
                const nextLevelXP = XP_TABLE[this.character.level].cumulative;
                if (this.character.xp >= nextLevelXP) {
                    this.character.level++;
                    const charTemplate = CHARACTERS[this.character.key];
                    this.character.stats.strength = Math.round(charTemplate.startingStats.strength + charTemplate.growth.strength * (this.character.level - 1));
                    this.character.stats.technique = Math.round(charTemplate.startingStats.technique + charTemplate.growth.technique * (this.character.level - 1));
                    this.character.stats.focus = Math.round(charTemplate.startingStats.focus + charTemplate.growth.focus * (this.character.level - 1));
                    this.character.stats.flexibility = Math.round(charTemplate.startingStats.flexibility + charTemplate.growth.flexibility * (this.character.level - 1));
                    this.character.maxEndurance = Math.round(charTemplate.startingEndurance + charTemplate.growth.endurance * (this.character.level - 1));
                    this.logAction('LEVEL_UP', { newLevel: this.character.level, newStats: {...this.character.stats}, newMaxEndurance: this.character.maxEndurance });
                }
            }

            train(area) {
                const trainingAreas = {
                    'gripBoard': { stat: 'focus', bonus: 5, time: 2, endurance: 10 },
                    'campusBoard': { stat: 'strength', bonus: 5, time: 2, endurance: 15 },
                    'moonBoard': { stat: 'technique', bonus: 5, time: 2, endurance: 12 },
                    'balanceCore': { stat: 'flexibility', bonus: 5, time: 2, endurance: 8 }
                };
                const training = trainingAreas[area];
                this.character.timeRemaining -= training.time;
                this.character.currentEndurance -= training.endurance;
                this.character.trainingBonuses[training.stat] += training.bonus;
                this.stats.trainingActions++;
                this.turnNumber++;
                this.logAction('TRAIN', { area, stat: training.stat, bonus: training.bonus, timeCost: training.time, enduranceCost: training.endurance });
            }

            rest() {
                this.character.timeRemaining -= 2;
                const recovery = this.character.key === 'ironLung' ? Math.ceil(this.character.maxEndurance * 1.5) : this.character.maxEndurance;
                this.character.currentEndurance = Math.min(this.character.maxEndurance, this.character.currentEndurance + recovery);
                this.stats.restActions++;
                this.turnNumber++;
                this.logAction('REST', { enduranceRecovered: recovery, currentEndurance: this.character.currentEndurance });
            }

            decideAction() {
                const totalStats = this.getTotalStats();

                if (this.character.currentEndurance < 20 && this.character.timeRemaining >= 2) {
                    return { type: 'rest' };
                }

                const climbableRoutes = [];
                for (const route of this.availableRoutes.bouldering) {
                    if (this.canAttemptRoute(route)) {
                        const difficulty = this.estimateRouteDifficulty(route, totalStats);
                        climbableRoutes.push({ route, area: 'bouldering', difficulty });
                    }
                }
                for (const route of this.availableRoutes.topRope) {
                    if (this.canAttemptRoute(route)) {
                        const difficulty = this.estimateRouteDifficulty(route, totalStats);
                        climbableRoutes.push({ route, area: 'topRope', difficulty });
                    }
                }
                for (const route of this.availableRoutes.leadClimbing) {
                    if (this.canAttemptRoute(route)) {
                        const difficulty = this.estimateRouteDifficulty(route, totalStats);
                        climbableRoutes.push({ route, area: 'leadClimbing', difficulty });
                    }
                }

                climbableRoutes.sort((a, b) => (b.route.xpSuccess / b.route.time) - (a.route.xpSuccess / a.route.time));

                for (const { route, area, difficulty } of climbableRoutes) {
                    if (difficulty >= -5 && difficulty <= 10) {
                        return { type: 'climb', route, area };
                    }
                }

                const avgStat = (totalStats.strength + totalStats.technique + totalStats.focus + totalStats.flexibility) / 4;
                if (avgStat < 30 && this.character.timeRemaining >= 2 && this.character.currentEndurance >= 15) {
                    const stats = [
                        { value: totalStats.strength, area: 'campusBoard' },
                        { value: totalStats.technique, area: 'moonBoard' },
                        { value: totalStats.focus, area: 'gripBoard' },
                        { value: totalStats.flexibility, area: 'balanceCore' }
                    ];
                    stats.sort((a, b) => a.value - b.value);
                    return { type: 'train', area: stats[0].area };
                }

                if (climbableRoutes.length > 0) {
                    return { type: 'climb', route: climbableRoutes[0].route, area: climbableRoutes[0].area };
                }

                if (this.character.timeRemaining >= 2) {
                    return { type: 'rest' };
                }

                return { type: 'wait' };
            }

            estimateRouteDifficulty(route, stats) {
                const avgDice = 7;
                return ((stats.strength - avgDice - route.strength) + (stats.technique - avgDice - route.technique) +
                        (stats.focus - avgDice - route.focus) + (stats.flexibility - avgDice - route.flexibility)) / 4;
            }

            endRound() {
                this.logAction('END_ROUND', { round: this.round, totalXP: this.character.xp, level: this.character.level });
                this.routeClearingPosition = (this.routeClearingPosition + 1) % 3;

                if (this.routeClearingPosition === 0) {
                    this.availableRoutes.bouldering = this.selectRandomRoutes(ROUTES.bouldering, 3);
                } else if (this.routeClearingPosition === 1) {
                    this.availableRoutes.leadClimbing = this.selectRandomRoutes(ROUTES.leadClimbing, 1);
                } else {
                    // Top Rope refresh: 2 routes per belayer (RuleModifications).
                    this.availableRoutes.topRope = this.selectRandomRoutes(ROUTES.topRope, this.belayerCount * 2);
                }

                this.character.timeRemaining = 10;
                this.character.trainingBonuses = { strength: 0, technique: 0, focus: 0, flexibility: 0 };

                // RuleModifications: belayer count is fixed — no round 5 / 12 ramp.

                this.round++;
            }

            runSimulation() {
                this.logAction('START_GAME', { character: this.character.name });

                while (this.round <= this.maxRounds) {
                    while (this.character.timeRemaining > 0) {
                        const action = this.decideAction();

                        if (action.type === 'climb') {
                            this.attemptClimb(action.route, action.area);
                        } else if (action.type === 'train') {
                            this.train(action.area);
                        } else if (action.type === 'rest') {
                            this.rest();
                        } else {
                            break;
                        }

                        if (this.character.timeRemaining <= 0) break;
                    }

                    this.endRound();
                }

                this.stats.finalLevel = this.character.level;
                this.logAction('END_GAME', {
                    finalLevel: this.character.level,
                    totalXP: this.character.xp,
                    totalClimbs: this.stats.totalClimbs,
                    successRate: this.stats.totalClimbs > 0 ? (this.stats.successfulClimbs / this.stats.totalClimbs * 100).toFixed(1) : 0
                });

                return {
                    character: this.character.name,
                    characterKey: this.character.key,
                    stats: this.stats,
                    log: this.log
                };
            }
        }

        // Global results storage
        let allResults = [];
        let currentSimulation = 0;

        function log(message) {
            const output = document.getElementById('output');
            output.textContent += message + '\n';
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('output').textContent = 'Output cleared. Ready to run simulations.\n';
        }

        function updateProgress(current, total) {
            const percent = Math.round((current / total) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressBar').textContent = `${current}/${total} (${percent}%)`;
        }

        async function startSimulations() {
            document.getElementById('runBtn').disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            clearOutput();

            allResults = [];
            const characterKeys = Object.keys(CHARACTERS);

            log('Starting 100 game simulations...\n');

            for (let i = 0; i < 100; i++) {
                const characterKey = characterKeys[i % characterKeys.length];
                log(`Running simulation ${i + 1}/100 - ${CHARACTERS[characterKey].name}`);

                const sim = new GameSimulation(characterKey, i + 1);
                const result = sim.runSimulation();
                allResults.push(result);

                updateProgress(i + 1, 100);

                // Allow UI to update
                await new Promise(resolve => setTimeout(resolve, 0));
            }

            log('\n✅ All simulations complete!');
            log('Click "Download All Results" to get individual logs and statistics report.');

            document.getElementById('downloadBtn').disabled = false;
            displaySummaryStats();
        }

        function displaySummaryStats() {
            const panel = document.getElementById('statsPanel');
            const grid = document.getElementById('statGrid');

            const totalClimbs = allResults.reduce((sum, r) => sum + r.stats.totalClimbs, 0);
            const totalSuccesses = allResults.reduce((sum, r) => sum + r.stats.successfulClimbs, 0);
            const avgLevel = allResults.reduce((sum, r) => sum + r.stats.finalLevel, 0) / allResults.length;
            const avgXP = allResults.reduce((sum, r) => sum + r.stats.totalXP, 0) / allResults.length;

            grid.innerHTML = `
                <div class="stat-box">
                    <div class="stat-label">Total Climbs</div>
                    <div class="stat-value">${totalClimbs}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Success Rate</div>
                    <div class="stat-value">${(totalSuccesses/totalClimbs*100).toFixed(1)}%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Avg Level</div>
                    <div class="stat-value">${avgLevel.toFixed(2)}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Avg XP</div>
                    <div class="stat-value">${avgXP.toFixed(0)}</div>
                </div>
            `;

            panel.classList.add('show');
        }

        function generateGameLog(result, simId) {
            let log = '='.repeat(80) + '\n';
            log += `SIMULATION ${simId} - ${result.character}\n`;
            log += '='.repeat(80) + '\n\n';

            let currentRound = 0;

            result.log.forEach(entry => {
                if (entry.round !== currentRound) {
                    currentRound = entry.round;
                    log += '\n' + '-'.repeat(80) + '\n';
                    log += `ROUND ${currentRound}\n`;
                    log += '-'.repeat(80) + '\n';
                }

                log += `\n[Turn ${entry.turn}] ${entry.action}\n`;

                if (entry.action === 'CLIMB') {
                    log += `  Route: ${entry.details.route} (${entry.details.grade}) - ${entry.details.area}\n`;
                    log += `  Dice: ${entry.details.rolls.join(', ')} (Using: ${entry.details.diceUsed.join(', ')} = ${entry.details.diceTotal})\n`;
                    log += `  Checks: Str:${entry.details.checks.strength?'✓':'✗'} Tech:${entry.details.checks.technique?'✓':'✗'} Foc:${entry.details.checks.focus?'✓':'✗'} Flex:${entry.details.checks.flexibility?'✓':'✗'}\n`;
                    log += `  Result: ${entry.details.success ? '✅ SUCCESS' : '❌ FAILED'}\n`;
                    log += `  XP Gained: +${entry.details.xpGained} (Total: ${entry.state.xp})\n`;
                    log += `  Costs: ${entry.details.timeCost} time, ${entry.details.enduranceCost} endurance\n`;
                } else if (entry.action === 'TRAIN') {
                    log += `  Area: ${entry.details.area}\n`;
                    log += `  Bonus: +${entry.details.bonus} ${entry.details.stat}\n`;
                    log += `  Costs: ${entry.details.timeCost} time, ${entry.details.enduranceCost} endurance\n`;
                } else if (entry.action === 'REST') {
                    log += `  Endurance Recovered: ${entry.details.enduranceRecovered}\n`;
                    log += `  Current Endurance: ${entry.details.currentEndurance}\n`;
                } else if (entry.action === 'LEVEL_UP') {
                    log += `  🎉 LEVEL UP to ${entry.details.newLevel}!\n`;
                    log += `  New Stats: Str:${entry.details.newStats.strength} Tech:${entry.details.newStats.technique} Foc:${entry.details.newStats.focus} Flex:${entry.details.newStats.flexibility}\n`;
                } else if (entry.action === 'END_ROUND') {
                    log += `  Round ${entry.details.round} Complete\n`;
                    log += `  Total XP: ${entry.details.totalXP}, Level: ${entry.details.level}\n`;
                }

                log += `  State: Level ${entry.state.level}, XP ${entry.state.xp}, Endurance ${entry.state.endurance}, Time ${entry.state.timeRemaining}\n`;
                log += `  Stats: Str:${entry.state.stats.strength} Tech:${entry.state.stats.technique} Foc:${entry.state.stats.focus} Flex:${entry.state.stats.flexibility}\n`;
            });

            log += '\n' + '='.repeat(80) + '\n';
            log += 'FINAL STATISTICS\n';
            log += '='.repeat(80) + '\n';
            log += `Character: ${result.character} (${result.characterKey})\n`;
            log += `Final Level: ${result.stats.finalLevel}\n`;
            log += `Total XP: ${result.stats.totalXP}\n`;
            log += `Total Climbs: ${result.stats.totalClimbs}\n`;
            log += `Successful: ${result.stats.successfulClimbs} (${(result.stats.successfulClimbs/result.stats.totalClimbs*100).toFixed(1)}%)\n`;
            log += `Failed: ${result.stats.failedClimbs} (${(result.stats.failedClimbs/result.stats.totalClimbs*100).toFixed(1)}%)\n`;
            log += `Training Actions: ${result.stats.trainingActions}\n`;
            log += `Rest Actions: ${result.stats.restActions}\n`;
            log += `\nRoutes Attempted by Area:\n`;
            log += `  Bouldering: ${result.stats.routesAttempted.bouldering} (Completed: ${result.stats.routesCompleted.bouldering})\n`;
            log += `  Top Rope: ${result.stats.routesAttempted.topRope} (Completed: ${result.stats.routesCompleted.topRope})\n`;
            log += `  Lead Climbing: ${result.stats.routesAttempted.leadClimbing} (Completed: ${result.stats.routesCompleted.leadClimbing})\n`;
            log += `\nHighest Grades Completed:\n`;
            log += `  Bouldering: ${result.stats.highestGradeCompleted.bouldering || 'None'}\n`;
            log += `  Top Rope: ${result.stats.highestGradeCompleted.topRope || 'None'}\n`;
            log += `  Lead Climbing: ${result.stats.highestGradeCompleted.leadClimbing || 'None'}\n`;

            return log;
        }

        function generateStatisticsReport(results) {
            let report = '='.repeat(100) + '\n';
            report += 'ROCK CLIMBING BOARD GAME - 100 SIMULATION STATISTICAL REPORT\n';
            report += '='.repeat(100) + '\n\n';

            const totalClimbs = results.reduce((sum, r) => sum + r.stats.totalClimbs, 0);
            const totalSuccesses = results.reduce((sum, r) => sum + r.stats.successfulClimbs, 0);
            const totalFails = results.reduce((sum, r) => sum + r.stats.failedClimbs, 0);
            const avgLevel = results.reduce((sum, r) => sum + r.stats.finalLevel, 0) / results.length;
            const avgXP = results.reduce((sum, r) => sum + r.stats.totalXP, 0) / results.length;

            report += 'OVERALL STATISTICS (100 Games)\n';
            report += '-'.repeat(100) + '\n';
            report += `Total Climbs Attempted: ${totalClimbs}\n`;
            report += `Total Successes: ${totalSuccesses} (${(totalSuccesses/totalClimbs*100).toFixed(2)}%)\n`;
            report += `Total Failures: ${totalFails} (${(totalFails/totalClimbs*100).toFixed(2)}%)\n`;
            report += `Average Final Level: ${avgLevel.toFixed(2)}\n`;
            report += `Average Total XP: ${avgXP.toFixed(0)}\n\n`;

            // Character breakdown
            report += 'CHARACTER PERFORMANCE BREAKDOWN\n';
            report += '-'.repeat(100) + '\n';

            const charStats = {};
            results.forEach(r => {
                if (!charStats[r.characterKey]) {
                    charStats[r.characterKey] = {
                        name: r.character,
                        games: 0,
                        totalXP: 0,
                        totalLevel: 0,
                        totalClimbs: 0,
                        totalSuccesses: 0,
                        highestLevel: 0,
                        highestXP: 0
                    };
                }
                const cs = charStats[r.characterKey];
                cs.games++;
                cs.totalXP += r.stats.totalXP;
                cs.totalLevel += r.stats.finalLevel;
                cs.totalClimbs += r.stats.totalClimbs;
                cs.totalSuccesses += r.stats.successfulClimbs;
                cs.highestLevel = Math.max(cs.highestLevel, r.stats.finalLevel);
                cs.highestXP = Math.max(cs.highestXP, r.stats.totalXP);
            });

            Object.entries(charStats).forEach(([key, cs]) => {
                report += `\n${cs.name}:\n`;
                report += `  Games Played: ${cs.games}\n`;
                report += `  Average Level: ${(cs.totalLevel / cs.games).toFixed(2)}\n`;
                report += `  Average XP: ${(cs.totalXP / cs.games).toFixed(0)}\n`;
                report += `  Average Climbs: ${(cs.totalClimbs / cs.games).toFixed(1)}\n`;
                report += `  Average Success Rate: ${(cs.totalSuccesses / cs.totalClimbs * 100).toFixed(1)}%\n`;
                report += `  Highest Level Achieved: ${cs.highestLevel}\n`;
                report += `  Highest XP Achieved: ${cs.highestXP}\n`;
            });

            // Top performances
            report += '\n' + '='.repeat(100) + '\n';
            report += 'TOP PERFORMANCES\n';
            report += '-'.repeat(100) + '\n';

            const topXP = [...results].sort((a, b) => b.stats.totalXP - a.stats.totalXP).slice(0, 5);
            report += '\nTop 5 by XP:\n';
            topXP.forEach((r, i) => {
                report += `  ${i+1}. Simulation ${results.indexOf(r) + 1} - ${r.character}: ${r.stats.totalXP} XP (Level ${r.stats.finalLevel})\n`;
            });

            const topLevel = [...results].sort((a, b) => b.stats.finalLevel - a.stats.finalLevel).slice(0, 5);
            report += '\nTop 5 by Level:\n';
            topLevel.forEach((r, i) => {
                report += `  ${i+1}. Simulation ${results.indexOf(r) + 1} - ${r.character}: Level ${r.stats.finalLevel} (${r.stats.totalXP} XP)\n`;
            });

            const topSuccessRate = [...results].sort((a, b) => {
                const rateA = a.stats.successfulClimbs / a.stats.totalClimbs;
                const rateB = b.stats.successfulClimbs / b.stats.totalClimbs;
                return rateB - rateA;
            }).slice(0, 5);
            report += '\nTop 5 by Success Rate:\n';
            topSuccessRate.forEach((r, i) => {
                const rate = (r.stats.successfulClimbs / r.stats.totalClimbs * 100).toFixed(1);
                report += `  ${i+1}. Simulation ${results.indexOf(r) + 1} - ${r.character}: ${rate}% (${r.stats.successfulClimbs}/${r.stats.totalClimbs})\n`;
            });

            return report;
        }

        function downloadAllResults() {
            const zip = { files: [] };

            // Generate individual logs
            allResults.forEach((result, idx) => {
                const logContent = generateGameLog(result, idx + 1);
                downloadFile(`simulation_${idx + 1}_log.txt`, logContent);
            });

            // Generate statistics report
            const statsReport = generateStatisticsReport(allResults);
            downloadFile('simulation_statistics.txt', statsReport);

            alert('Download complete! Check your Downloads folder for all 101 files (100 logs + 1 statistics report).');
        }

        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>

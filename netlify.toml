# Netlify build control.
#
# Skip Netlify builds (branch deploys + PR deploy previews) for the cleanup
# branches (TechDebt, LintCleanup) while that work lands, without touching
# production or other PRs.
#
# How it works: Netlify runs the `ignore` command before every build to decide
# whether to skip it — exit 0 = skip, non-zero = build. $HEAD is the PR head
# branch on deploy previews; $BRANCH is the branch on branch deploys. Builds on
# main (production) and every other branch/PR proceed as usual.
#
# To re-enable builds for a branch, remove it from the case list (or delete
# this [build] block / the file).
[build]
  ignore = '''
  case "${HEAD:-$BRANCH}" in
    TechDebt|LintCleanup) exit 0 ;;
    *) exit 1 ;;
  esac
  '''

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All In Ascent — Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wall-base: #c2a07a;
    --wall-shade: #8a6440;
    --coral: #ff6845;
    --marigold: #ffae28;
    --lime: #b6d62d;
    --teal: #1fb8a6;
    --cobalt: #2c66cf;
    --raspberry: #d8347d;
    --violet: #8857d4;
    --chalk: #f4ede0;
    --ink: #2a1d12;
    --ink-soft: #5a4530;
    --tape-cream: #f8f0dc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hanken Grotesk', sans-serif;
    color: var(--ink);
    background-color: var(--wall-base);
    background-image:
      radial-gradient(circle at 50% 50%, rgba(36,20,8,0.45) 1px, rgba(36,20,8,0.18) 2px, transparent 3px),
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,220,170,0.22), transparent 60%),
      radial-gradient(ellipse 70% 70% at 90% 95%, rgba(60,35,15,0.28), transparent 70%);
    background-size: 72px 72px, auto, auto;
    background-attachment: fixed;
    padding: 24px;
    min-height: 100vh;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 60px auto; }
  .card {
    background: var(--tape-cream);
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 36px 40px 32px;
    box-shadow: 6px 8px 0 var(--ink), 0 12px 28px rgba(40,20,10,0.32);
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 6vw, 3.2rem);
    text-align: center;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 4px;
  }
  h1 em { font-style: italic; font-weight: 500; color: var(--coral); }
  .sub {
    text-align: center;
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 30px;
  }
  label {
    font-family: 'Geist Mono', monospace;
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-soft);
    margin-top: 14px;
    display: block;
  }
  input {
    width: 100%;
    margin-top: 6px;
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 14px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: white;
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--coral); outline-offset: 1px; }
  .btn-row {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: 0.02em;
    padding: 12px 24px;
    border-radius: 100px;
    cursor: pointer;
    border: 2px solid var(--ink);
    box-shadow: 3px 4px 0 var(--ink);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  button:hover { transform: translate(-1px, -1px); box-shadow: 4px 5px 0 var(--ink); }
  button.primary { background: var(--coral); color: white; }
  button.ghost { background: transparent; color: var(--ink); }
  .footnote {
    margin-top: 22px;
    text-align: center;
    font-size: 0.86rem;
    color: var(--ink-soft);
    font-style: italic;
  }
  .toast {
    position: fixed; top: 20px; right: 20px;
    background: var(--ink); color: var(--chalk);
    padding: 10px 16px; border-radius: 8px;
    font-weight: 500;
    box-shadow: 4px 5px 0 rgba(0,0,0,0.35);
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>All-In <em>Ascent.</em></h1>
    <div class="sub">Online play · friend &amp; bot rooms</div>

    <label for="username">Your name</label>
    <input id="username" maxlength="24" placeholder="climber-handle" autocomplete="off">

    <label for="room">Room ID</label>
    <input id="room" placeholder="e.g. friday-night" autocomplete="off">

    <label for="password">Room password</label>
    <input id="password" type="password" placeholder="set by the host on first join" autocomplete="off">

    <div class="btn-row">
      <button class="primary" id="joinBtn" type="button">Join / Create Room</button>
      <button class="ghost" type="button" onclick="window.location='index.html'">Local Play Instead</button>
    </div>
    <div class="footnote">
      First person to join a fresh room is the host. Share the room ID + password with friends.
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
  // ----- Backend host resolution (same logic as online/client.js) -----
  const PRODUCTION_PARTYKIT_HOST = 'all-in-ascent.srbobo.partykit.dev';

  function resolveBackendHost() {
    const params = new URLSearchParams(window.location.search);
    const override = params.get('host');
    if (override) return override.trim();
    const h = window.location.hostname;
    if (h === '127.0.0.1' || h === 'localhost' || h === '0.0.0.0') {
      return window.location.host;
    }
    return PRODUCTION_PARTYKIT_HOST;
  }

  // ----- Persistence + form prefill -----
  const LS_KEY = 'all-in-ascent.online';
  function loadPrefs() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
  }
  function savePrefs(p) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(p)); } catch {}
  }
  const prefs = loadPrefs();
  document.getElementById('username').value = prefs.username || '';
  document.getElementById('room').value = prefs.room || '';
  document.getElementById('password').value = prefs.password || '';

  function toast(msg, ms = 4000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.add('hidden'), ms);
  }

  // ----- Join button → redirect to index.html in online mode -----
  document.getElementById('joinBtn').addEventListener('click', () => {
    const username = document.getElementById('username').value.trim();
    const room = document.getElementById('room').value.trim() || 'default';
    const password = document.getElementById('password').value;
    if (!username) { toast('Enter a name'); return; }
    const host = resolveBackendHost();
    if (!host || host.includes('YOUR-PARTYKIT-USERNAME')) {
      toast('Backend not configured — see online.html PRODUCTION_PARTYKIT_HOST', 8000);
      return;
    }
    savePrefs({ username, room, password });
    const qs = new URLSearchParams({
      online: '1',
      host,
      room,
      user: username,
      password,
    });
    window.location = 'index.html?' + qs.toString();
  });

  // Allow Enter key on any field to submit
  ['username', 'room', 'password'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('joinBtn').click();
    });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-In Ascent - Rock Climbing Board Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .game-setup {
            padding: 30px;
            background: #f8f9fa;
        }

        .game-board {
            display: none;
            padding: 20px;
        }

        .character-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .character-card {
            background: white;
            border: 3px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-color: #667eea;
        }

        .character-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .character-name {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        .character-archetype {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .character-description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .stat-label {
            color: #666;
            font-size: 0.85em;
        }

        .stat-value {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.1em;
        }

        .special-ability {
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid #ffc107;
        }

        .ability-name {
            font-weight: bold;
            color: #856404;
            margin-bottom: 5px;
        }

        .ability-desc {
            font-size: 0.85em;
            color: #856404;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            font-weight: bold;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .game-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .info-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
        }

        .player-panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            margin-top: 20px;
            border: 3px solid #667eea;
            transition: all 0.3s ease;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .endurance-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }

        .endurance-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .xp-bar {
            width: 100%;
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.85em;
        }

        .game-areas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .area-panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #ddd;
        }

        .area-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .route-card {
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .route-card:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .route-name {
            font-weight: bold;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        .route-grade {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .route-requirements {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            margin-top: 10px;
            font-size: 0.85em;
        }

        .requirement {
            background: white;
            padding: 5px;
            border-radius: 4px;
        }

        .requirement.met {
            color: #28a745;
            font-weight: bold;
        }

        .requirement.unmet {
            color: #dc3545;
        }

        .route-costs {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 0.9em;
        }

        .training-area {
            background: #fff3cd;
            border-color: #ffc107;
        }

        .training-bonus {
            background: #28a745;
            color: white;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .store-panel {
            background: #f0f8ff;
            border-color: #007bff;
        }

        .gear-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .gear-card:hover {
            border-color: #007bff;
            transform: translateX(5px);
        }

        .gear-card.owned {
            background: #d4edda;
            border-color: #28a745;
            cursor: default;
        }

        .gear-card.locked {
            border: 2px dashed #dc3545;
            background: #f8d7da;
        }

        .gear-card.locked:hover {
            transform: none;
            cursor: not-allowed;
        }

        .gear-card.access-gear-card {
            border-left: 4px solid #ffc107;
        }

        .gear-category {
            font-size: 0.8em;
            color: #6c757d;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .area-locked {
            padding: 20px;
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }

        .area-locked h3 {
            color: #856404;
            margin-top: 0;
        }

        .area-locked ul {
            list-style: none;
            padding: 0;
            color: #856404;
            font-weight: bold;
        }

        .gear-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .gear-cost {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .gear-effect {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .dice-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }

        .die {
            width: 80px;
            height: 80px;
            background: white;
            border: 3px solid #667eea;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            animation: rollDice 0.5s;
        }

        @keyframes rollDice {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(90deg); }
            50% { transform: rotate(180deg); }
            75% { transform: rotate(270deg); }
        }

        .result-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .result-success {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .result-failure {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .result-text {
            font-size: 1.2em;
            text-align: center;
            margin-bottom: 15px;
        }

        .result-details {
            font-size: 0.95em;
            color: #666;
        }

        .equipment-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .equipment-badge {
            background: #007bff;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .log-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            background: white;
            border-radius: 5px;
        }

        .log-time {
            color: #666;
            font-size: 0.85em;
        }

        .turn-indicator {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .player-turn {
            border-color: #28a745 !important;
            border-width: 4px !important;
            background: linear-gradient(135deg, #f0fff4 0%, #e8f5e9 100%) !important;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.5) !important;
            position: relative;
            animation: pulse 2s infinite;
        }

        .player-turn::before {
            content: "🎯 ACTIVE PLAYER";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 10;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(40, 167, 69, 0.5);
            }
            50% {
                transform: scale(1.01);
                box-shadow: 0 0 30px rgba(40, 167, 69, 0.7);
            }
        }

        .number-input {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 20px 0;
        }

        .number-input input {
            width: 80px;
            padding: 10px;
            font-size: 1.2em;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        .number-input label {
            font-weight: bold;
        }

        .route-clearing-indicator {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
            border: 3px solid #ffc107;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
            animation: clearingPulse 2s infinite;
            box-shadow: 0 4px 6px rgba(255, 193, 7, 0.3);
        }

        @keyframes clearingPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 4px 6px rgba(255, 193, 7, 0.3);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 6px 12px rgba(255, 193, 7, 0.5);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧗 All-In Ascent</h1>
            <p class="subtitle">Alpine Indoors Rock Climbing Board Game</p>
        </header>

        <div class="game-setup" id="gameSetup">
            <h2>Select Number of Players</h2>
            <div class="number-input">
                <label for="numPlayers">Players:</label>
                <input type="number" id="numPlayers" min="1" max="4" value="1">
            </div>
            <button class="btn" onclick="startCharacterSelect()">Continue to Character Selection</button>

            <div id="characterSelection" style="display: none; margin-top: 30px;">
                <h2>Select Your Character</h2>
                <div class="character-select" id="characterSelect"></div>
                <button class="btn" id="startGameBtn" onclick="startGame()" disabled>Start Game</button>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="turn-indicator" id="turnIndicator"></div>

            <div class="game-info" id="gameInfo"></div>

            <div id="playersContainer"></div>

            <div class="game-areas">
                <div class="area-panel">
                    <div class="area-title">🪨 Bouldering Wall</div>
                    <div id="boulderingRoutes"></div>
                </div>

                <div class="area-panel">
                    <div class="area-title">🧗 Top Rope</div>
                    <div id="topRopeRoutes"></div>
                </div>

                <div class="area-panel">
                    <div class="area-title">⛰️ Lead Climbing</div>
                    <div id="leadClimbingRoutes"></div>
                </div>

                <div class="area-panel training-area">
                    <div class="area-title">💪 Training Areas</div>
                    <p style="margin-bottom: 10px; color: #856404; font-weight: bold; font-size: 0.9em;">Gain permanent stat bonuses!</p>
                    <div id="trainingAreas"></div>
                </div>

                <div class="area-panel store-panel">
                    <div class="area-title">🏪 Gear Shop</div>
                    <div id="gearShop"></div>
                </div>

                <div class="area-panel">
                    <div class="area-title">😌 Rest Area</div>
                    <div id="restAreaInfo"></div>
                    <button class="btn btn-success" onclick="restAction()">Rest (Recover Full Endurance)</button>
                    <p style="margin-top: 10px; color: #666;">Cost: 1 Time Unit</p>
                </div>
            </div>

            <div class="log-panel" id="gameLog">
                <h3>Game Log</h3>
                <div id="logEntries"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="climbModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle"></div>
            <div id="modalBody"></div>
            <div class="action-buttons">
                <button class="btn" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
